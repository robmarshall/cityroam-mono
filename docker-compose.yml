services:
  dev:
    build: .
    volumes:
      - .:/workspace
      - /c/Users/rober/.claude:/home/dev/.claude
      - /c/Users/rober/.ssh:/home/dev/.ssh:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - GIT_USER_NAME=Rob
      - GIT_USER_EMAIL=hello@robertmarshall.dev
    depends_on:
      - postgres
      - redis
    networks:
      - cityroam-network

  # Local development: SameSite=None cookies require HTTPS in browsers.
  # localhost is exempt from the Secure requirement, so use localhost for local dev.
  # Alternatively, use mkcert to generate local SSL certs and configure Vite/Next.js/Hono with them.

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cityroam
      POSTGRES_PASSWORD: cityroam
      POSTGRES_DB: cityroam
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityroam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network

  api-http:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm run dev:api:http"
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cityroam:cityroam@postgres:5432/cityroam
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cityroam-network

  api-ws:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm run dev:api:ws"
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cityroam:cityroam@postgres:5432/cityroam
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cityroam-network

  app:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm run dev:app"
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - .:/workspace
    networks:
      - cityroam-network

  marketing:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm run dev:marketing"
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - .:/workspace
    networks:
      - cityroam-network

  admin:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm run dev:admin"
    ports:
      - "5174:5174"
    env_file: .env
    volumes:
      - .:/workspace
    networks:
      - cityroam-network

volumes:
  postgres-data:
  redis-data:

networks:
  cityroam-network:
    driver: bridge
