# Production docker-compose for Coolify deployment
# Backend services only. All frontends (app, admin, marketing) are on Vercel,
# and a Cloudflare worker (infra/cloudflare-workers/prod-router.js) routes
# <DOMAIN>/app/* to the player-app project and everything else to marketing.
# This file mirrors docker-compose.staging.yml; keep the two in step.
#
# Required env vars in Coolify:
#   API_DOMAIN          - e.g. api.cityroam.co.uk
#   WS_DOMAIN           - e.g. ws.cityroam.co.uk (separate subdomain for WebSocket)
#   POSTGRES_PASSWORD   - strong random password
#   REDIS_PASSWORD      - strong random password
#
# All four are interpolated with `:?` — an unset value aborts the deploy rather
# than producing an empty Traefik Host() rule that silently 404s.
#
# Optional:
#   SENTRY_DSN          - error reporting for api-http and api-ws; empty disables it
#   SENTRY_ENVIRONMENT  - set explicitly to `production`; empty falls back to NODE_ENV
#                         (production), which would mix staging into prod alerts
#   SENTRY_RELEASE      - version or SHA (no prefix); empty falls back to Coolify's
#                         SOURCE_COMMIT, reported as api@<sha>
#
# Frontend values that must match this file (set on the Vercel projects):
#   VITE_API_URL        = https://<API_DOMAIN>
#   VITE_WS_URL         = wss://<WS_DOMAIN>   (no path, no port — the app appends
#                         /ws/<code>, see packages/app/src/contexts/WebSocketContext.tsx)
#
# Traefik router and service names are prefixed `cityroam-prod-` so they cannot
# collide with the staging stack's `api-http` / `api-ws` routers when both run
# behind the same Coolify Traefik instance.
#
# All other env vars should be set in Coolify per .env.example.

services:
  cityroam-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cityroam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cityroam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityroam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  cityroam-redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
    depends_on:
      cityroam-postgres:
        condition: service_healthy
    networks:
      - cityroam-network
    restart: "no"

  api-http:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/http/index.js"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Admin API keys must carry this environment (crk_prd_…); keys minted on
      # another deployment are refused. Pinned here so it cannot be forgotten.
      API_KEY_ENV: prd
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}cityroam-redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Empty values fall back (see packages/api/src/lib/sentry.ts).
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Coolify sets SOURCE_COMMIT; the API uses it as the Sentry release (api@<sha>)
      # when SENTRY_RELEASE is not set.
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      cityroam-redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cityroam-prod-api-http.rule=Host(`${API_DOMAIN:?API_DOMAIN must be set (e.g. api.cityroam.co.uk)}`)"
      - "traefik.http.routers.cityroam-prod-api-http.entrypoints=https"
      - "traefik.http.routers.cityroam-prod-api-http.tls=true"
      - "traefik.http.routers.cityroam-prod-api-http.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cityroam-prod-api-http.service=cityroam-prod-api-http"
      - "traefik.http.services.cityroam-prod-api-http.loadbalancer.server.port=3001"
      - "traefik.http.services.cityroam-prod-api-http.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.cityroam-prod-api-http.loadbalancer.healthcheck.interval=30s"

  api-ws:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/ws/index.js"]
    environment:
      NODE_ENV: production
      WS_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}cityroam-redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Empty values fall back (see packages/api/src/lib/sentry.ts).
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Coolify sets SOURCE_COMMIT; the API uses it as the Sentry release (api@<sha>)
      # when SENTRY_RELEASE is not set.
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      cityroam-redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cityroam-prod-api-ws.rule=Host(`${WS_DOMAIN:?WS_DOMAIN must be set (e.g. ws.cityroam.co.uk)}`)"
      - "traefik.http.routers.cityroam-prod-api-ws.entrypoints=https"
      - "traefik.http.routers.cityroam-prod-api-ws.tls=true"
      - "traefik.http.routers.cityroam-prod-api-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cityroam-prod-api-ws.service=cityroam-prod-api-ws"
      - "traefik.http.services.cityroam-prod-api-ws.loadbalancer.server.port=3002"
      - "traefik.http.services.cityroam-prod-api-ws.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.cityroam-prod-api-ws.loadbalancer.healthcheck.interval=30s"

volumes:
  postgres-data:
  redis-data:

networks:
  cityroam-network:
    driver: bridge
  coolify:
    external: true
