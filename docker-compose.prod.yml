# Production docker-compose for Coolify deployment
# Traefik routing is configured via labels on each service.
#
# Required: Set these in Coolify's environment variables UI:
#   DOMAIN          - e.g. cityroam.co.uk
#   API_DOMAIN      - e.g. api.cityroam.co.uk
#   ADMIN_DOMAIN    - e.g. admin.cityroam.co.uk
#
# Frontend BUILD-TIME vars. Vite and Next.js inline these into the bundle when
# the image is built, so they are passed as build args (not just env) and a
# missing value fails the build instead of shipping localhost URLs:
#   VITE_API_URL           - e.g. https://api.cityroam.co.uk       (app + admin)
#   VITE_WS_URL            - e.g. wss://api.cityroam.co.uk         (app; /ws/* is
#                            routed to api-ws by the PathPrefix rule below)
#   VITE_POSTHOG_KEY       - optional
#   VITE_POSTHOG_HOST      - optional
#   VITE_REVIEW_LINK       - optional
#   NEXT_PUBLIC_API_URL    - e.g. https://api.cityroam.co.uk       (marketing)
#   NEXT_PUBLIC_SITE_URL   - e.g. https://cityroam.co.uk           (marketing)
#   NEXT_PUBLIC_POSTHOG_KEY - optional
#
# Every var above is interpolated with `:?` where it is required, so an unset
# value aborts the deploy rather than yielding an empty Traefik Host() rule
# that silently 404s.
#
# All other env vars should be set in Coolify per .env.example.
# Traefik and Let's Encrypt SSL are managed by Coolify automatically.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cityroam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cityroam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityroam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cityroam}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cityroam-network
    restart: "no"

  api-http:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/http/index.js"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTP API routes (non-WebSocket)
      - "traefik.http.routers.api-http.rule=Host(`${API_DOMAIN:?API_DOMAIN must be set (e.g. api.cityroam.co.uk)}`)"
      - "traefik.http.routers.api-http.entrypoints=https"
      - "traefik.http.routers.api-http.tls=true"
      - "traefik.http.routers.api-http.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-http.loadbalancer.server.port=3001"
      # Lower priority than api-ws so /ws/* is routed to WebSocket server
      - "traefik.http.routers.api-http.priority=10"
      # Health check
      - "traefik.http.services.api-http.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-http.loadbalancer.healthcheck.interval=30s"

  api-ws:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/ws/index.js"]
    environment:
      NODE_ENV: production
      WS_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # WebSocket routes — PathPrefix /ws/ on the API domain
      - "traefik.http.routers.api-ws.rule=Host(`${API_DOMAIN:?API_DOMAIN must be set (e.g. api.cityroam.co.uk)}`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.api-ws.entrypoints=https"
      - "traefik.http.routers.api-ws.tls=true"
      - "traefik.http.routers.api-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-ws.loadbalancer.server.port=3002"
      # Higher priority than api-http so /ws/* is matched first
      - "traefik.http.routers.api-ws.priority=20"
      # Health check
      - "traefik.http.services.api-ws.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-ws.loadbalancer.healthcheck.interval=30s"

  marketing:
    build:
      context: .
      dockerfile: packages/marketing/Dockerfile
      # Inlined into the bundle at build time — see packages/marketing/Dockerfile.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set (e.g. https://api.cityroam.co.uk)}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set (e.g. https://cityroam.co.uk)}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    env_file: .env
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Marketing catches all traffic on the root domain EXCEPT /app/*
      - "traefik.http.routers.marketing.rule=Host(`${DOMAIN:?DOMAIN must be set (e.g. cityroam.co.uk)}`)"
      - "traefik.http.routers.marketing.entrypoints=https"
      - "traefik.http.routers.marketing.tls=true"
      - "traefik.http.routers.marketing.tls.certresolver=letsencrypt"
      - "traefik.http.services.marketing.loadbalancer.server.port=3000"
      # Lower priority than app so /app/* is matched first
      - "traefik.http.routers.marketing.priority=1"
      # Health check
      - "traefik.http.services.marketing.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.marketing.loadbalancer.healthcheck.interval=30s"

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
      # Inlined into the bundle at build time — see packages/app/Dockerfile.
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set (e.g. https://api.cityroam.co.uk)}
        VITE_WS_URL: ${VITE_WS_URL:?VITE_WS_URL must be set (e.g. wss://api.cityroam.co.uk)}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_REVIEW_LINK: ${VITE_REVIEW_LINK:-}
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # App SPA at /app/* on the root domain
      # No strip-prefix — the app's base path is /app/ (configured in vite.config.ts)
      - "traefik.http.routers.app.rule=Host(`${DOMAIN:?DOMAIN must be set (e.g. cityroam.co.uk)}`) && PathPrefix(`/app/`)"
      - "traefik.http.routers.app.entrypoints=https"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      # Higher priority than marketing so /app/* is matched first
      - "traefik.http.routers.app.priority=10"

  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
      # Inlined into the bundle at build time — see packages/admin/Dockerfile.
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set (e.g. https://api.cityroam.co.uk)}
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Admin on its own subdomain
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set (e.g. admin.cityroam.co.uk)}`)"
      - "traefik.http.routers.admin.entrypoints=https"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

volumes:
  postgres-data:
  redis-data:

networks:
  cityroam-network:
    driver: bridge
  coolify:
    external: true
