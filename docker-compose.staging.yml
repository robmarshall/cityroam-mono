# Staging docker-compose for Coolify deployment
# Backend services only. All frontends (app, admin, marketing) are on Vercel.
#
# Required env vars in Coolify:
#   API_DOMAIN          - e.g. api-staging.cityroam.co.uk
#   WS_DOMAIN           - e.g. ws-staging.cityroam.co.uk (separate subdomain for WebSocket)
#   POSTGRES_PASSWORD   - strong random password
#   REDIS_PASSWORD      - strong random password
#
# All four are interpolated with `:?` — an unset value aborts the deploy rather
# than producing an empty Traefik Host() rule that silently 404s.
#
# All other env vars should be set in Coolify per .env.example.

services:
  cityroam-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cityroam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cityroam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityroam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  cityroam-redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityroam-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
    depends_on:
      cityroam-postgres:
        condition: service_healthy
    networks:
      - cityroam-network
    restart: "no"

  api-http:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/http/index.js"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}cityroam-redis:6379
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      cityroam-redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-http.rule=Host(`${API_DOMAIN:?API_DOMAIN must be set (e.g. api-staging.cityroam.co.uk)}`)"
      - "traefik.http.routers.api-http.entrypoints=https"
      - "traefik.http.routers.api-http.tls=true"
      - "traefik.http.routers.api-http.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-http.loadbalancer.server.port=3001"
      - "traefik.http.services.api-http.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-http.loadbalancer.healthcheck.interval=30s"

  api-ws:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "--import", "tsx", "dist/ws/index.js"]
    environment:
      NODE_ENV: production
      WS_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cityroam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@cityroam-postgres:5432/${POSTGRES_DB:-cityroam}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}cityroam-redis:6379
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      cityroam-redis:
        condition: service_healthy
    networks:
      - cityroam-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-ws.rule=Host(`${WS_DOMAIN:?WS_DOMAIN must be set (e.g. ws-staging.cityroam.co.uk)}`)"
      - "traefik.http.routers.api-ws.entrypoints=https"
      - "traefik.http.routers.api-ws.tls=true"
      - "traefik.http.routers.api-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-ws.loadbalancer.server.port=3002"
      - "traefik.http.services.api-ws.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-ws.loadbalancer.healthcheck.interval=30s"

volumes:
  postgres-data:
  redis-data:

networks:
  cityroam-network:
    driver: bridge
  coolify:
    external: true